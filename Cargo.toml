[workspace]
members = ["crates/gnista-core", "crates/gnista", "crates/gnista-script", "crates/gnista-gui", "crates/gnista-mcp", "crates/gnista-agent"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "GPL-3.0-or-later"

# Dependencies are optimised even in debug builds, so tests that run egui,
# QuickJS and tree-sitter run near release speed, while Gnista's own crates
# still build quickly and debug well.
[profile.dev.package."*"]
opt-level = 2
