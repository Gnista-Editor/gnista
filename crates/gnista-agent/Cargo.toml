[package]
name = "gnista-agent"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["v8"]
# The script engine, as gnista-script's features choose it.
quickjs = ["gnista-script/quickjs", "gnista-mcp/quickjs"]
v8 = ["gnista-script/v8", "gnista-mcp/v8"]

[dependencies]
gnista-core = { version = "0.2.0", path = "../gnista-core" }
gnista-script = { version = "0.2.0", path = "../gnista-script", default-features = false }
gnista-mcp = { version = "0.2.0", path = "../gnista-mcp", default-features = false }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
