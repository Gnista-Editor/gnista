[package]
name = "gnista-gui"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["v8"]
# The script engine, as gnista-script's features choose it.
quickjs = ["gnista-script/quickjs", "gnista-agent/quickjs", "gnista-mcp/quickjs"]
v8 = ["gnista-script/v8", "gnista-agent/v8", "gnista-mcp/v8"]

[dependencies]
arboard = "3.7"
gnista-agent = { version = "0.1.0", path = "../gnista-agent", default-features = false }
eframe = "0.37"
egui = "0.37"
gnista-core = { version = "0.1.0", path = "../gnista-core" }
gnista-script = { version = "0.1.0", path = "../gnista-script", default-features = false }
gnista-mcp = { version = "0.1.0", path = "../gnista-mcp", default-features = false }
fontique = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"
