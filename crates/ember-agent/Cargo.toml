[package]
name = "ember-agent"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["quickjs"]
# The script engine, as ember-script's features choose it.
quickjs = ["ember-script/quickjs", "ember-mcp/quickjs"]
v8 = ["ember-script/v8", "ember-mcp/v8"]

[dependencies]
ember-core = { version = "0.1.0", path = "../ember-core" }
ember-script = { version = "0.1.0", path = "../ember-script", default-features = false }
ember-mcp = { version = "0.1.0", path = "../ember-mcp", default-features = false }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
