[package]
name = "ember-script"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ember-core = { version = "0.1.0", path = "../ember-core" }
rquickjs = { version = "0.14", features = ["loader"] }
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_parser = "46"
swc_ecma_visit = "29"
swc_ts_fast_strip = "59"

[build-dependencies]
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_parser = "46"
swc_ecma_visit = "29"
swc_ts_fast_strip = "59"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3.27.0"
