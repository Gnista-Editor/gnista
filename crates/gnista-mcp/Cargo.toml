[package]
name = "gnista-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["v8"]
# The script engine, as gnista-script's features choose it.
quickjs = ["gnista-script/quickjs"]
v8 = ["gnista-script/v8"]

[dependencies]
gnista-core = { version = "0.1.0", path = "../gnista-core" }
gnista-script = { version = "0.1.0", path = "../gnista-script", default-features = false }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
