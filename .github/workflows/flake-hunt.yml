# Temporary: runs two tests that failed now and then on CI many times,
# to catch them failing with their diagnostics. Deleted before merging.

name: Flake hunt

on:
  push:
    branches: [claude/flaky-tests]

permissions:
  contents: read

jobs:
  hunt:
    name: hunt on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and cargo-nextest
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          case "$RUNNER_OS" in macOS) platform=mac ;; *) platform=linux ;; esac
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          curl -LsSf "https://get.nexte.st/latest/$platform" | tar zxf - -C "$bin"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ matrix.os }}-v8-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ matrix.os }}-v8-
      - name: Build the tests
        run: cargo nextest run --locked -p gnista-script -p gnista-mcp --no-run
      - name: Run them again and again
        run: |
          failed=0
          for i in $(seq 1 40); do
            if ! cargo nextest run --locked -p gnista-script --test all processes::killing_ends_it_and_what_it_started --no-capture --hide-progress-bar 2>&1 | tail -30 > out.txt; then failed=$((failed+1)); fi
            if grep -q "FAIL" out.txt; then echo "::group::kill test failed, run $i"; cat out.txt; echo "::endgroup::"; fi
            if ! cargo nextest run --locked -p gnista-mcp the_binary_passes_messages_to_a_running_editor --no-capture --hide-progress-bar 2>&1 | tail -30 > out.txt; then failed=$((failed+1)); fi
            if grep -q "FAIL\|TIMEOUT" out.txt; then echo "::group::socket test failed, run $i"; cat out.txt; echo "::endgroup::"; fi
          done
          echo "failures: $failed"
      - name: The whole of both suites, three times, as CI runs them
        run: |
          for i in 1 2 3; do
            cargo nextest run --locked -p gnista-script --test all -p gnista-mcp --hide-progress-bar --no-fail-fast > full.txt 2>&1 || true
            grep -E "Summary" full.txt || true
            grep -B2 -A30 "panicked at" full.txt | grep -v "^\s*PASS" | head -80 || true
          done
