# Builds E8's terminal editor and e8-mcp for each platform, and E8.app on
# macOS, after each merge to main, and releases them when the version in
# Cargo.toml has not been released yet (docs/adr/0060-releases.md).
#
# To release: bump `version` in the workspace Cargo.toml in a pull request
# and merge it. The build on main then waits for the tests on the same
# commit, tags it vX.Y.Z and makes the GitHub Release. Building on main also
# keeps the build cache warm, and shows a broken release build before any
# release is wanted.
#
# Pushing a tag by hand still releases, building that tag. Run it by hand
# (workflow_dispatch) to build any branch without releasing.

name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            app: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in Cargo.toml, $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --locked -p e8 -p e8-mcp

      - name: Check that it starts
        run: |
          out=$(E8_CONFIG_DIR="$RUNNER_TEMP/e8" target/release/e8 --batch --eval 'e8.message("e8 " + e8.variable("e8-version"))' 2>&1)
          echo "$out"
          [ "$out" = "e8 ${{ steps.version.outputs.version }}" ]

      - name: Pack
        run: |
          name="e8-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/e8 target/release/e8-mcp LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      # The GUI as macOS's app, signed ad hoc as make app signs it: with no
      # Developer ID, macOS opens it when curl or Homebrew fetched it, but
      # not when a browser did, which marks it quarantined.
      - name: Build E8.app
        if: matrix.app
        run: |
          make app
          codesign --verify --deep --strict --verbose=2 target/E8.app
          name="E8-${{ steps.version.outputs.version }}-${{ matrix.target }}.app"
          tar -C target -czf "dist/$name.tar.gz" E8.app
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # A tag pushed by hand is released. On main, the version is released
      # only if it has no tag yet: a merge that bumps it.
      - name: Is this version released?
        id: decide
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "E8 $version is released already."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "E8 $version is not released yet."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Tests run on main after each merge, not on pull requests, so a
      # release from main waits for this commit's to pass.
      - name: Wait for the tests
        if: steps.decide.outputs.release == 'true' && github.ref_type != 'tag'
        run: |
          for i in $(seq 1 120); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
              --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "The tests passed."; exit 0 ;;
              completed*) echo "::error::The tests failed on this commit ($run), so it is not released"; exit 1 ;;
              "") if [ "$i" -gt 10 ]; then echo "::warning::No test run for this commit; releasing without one"; exit 0; fi ;;
            esac
            sleep 30
          done
          echo "::error::The tests did not finish within an hour"
          exit 1

      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.release == 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Make the release
        if: steps.decide.outputs.release == 'true'
        run: |
          ls -l dist
          version="${{ steps.decide.outputs.version }}"
          tag="${{ steps.decide.outputs.tag }}"
          # How to install it, before the notes GitHub generates from the
          # pull requests. The binaries are not signed, so macOS quarantines
          # them when a browser downloads them, and refuses to open them.
          notes=$(cat <<NOTES
          ## Installing

          Download with \`curl\`, not a browser: macOS quarantines unsigned programs a browser downloads, and will not open them.

          \`\`\`bash
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/e8-$version-aarch64-apple-darwin.tar.gz | tar xz
          \`\`\`

          On Linux, take \`x86_64-unknown-linux-gnu\` in place of \`aarch64-apple-darwin\`. The folder holds \`e8\`, the terminal editor, and \`e8-mcp\`.

          The GUI, as an app for Apple silicon, into /Applications:

          \`\`\`bash
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/E8-$version-aarch64-apple-darwin.app.tar.gz | tar xz -C /Applications
          \`\`\`

          If a browser downloaded either on a Mac, \`xattr -dr com.apple.quarantine\` on what it unpacked lets it run.
          NOTES
          )
          # On main this makes the tag, at this commit; a pushed tag must exist.
          if [ "$GITHUB_REF_TYPE" = tag ]; then where=--verify-tag; else where="--target=$GITHUB_SHA"; fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "E8 $version" \
            --notes "$notes" \
            --generate-notes \
            "$where"
